name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read manifest version
        id: manifest
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")"
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        env:
          OBSIDIAN_PLUGINS_DIR: ''
          OBSIDIAN_DEPLOY_LOG: ''
        run: npm run build:release

      - name: Audit all dependencies
        run: npm run audit:dependencies

      - name: Verify Community artifacts
        run: npm run verify:community

      - name: Install media test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium

      - name: Verify real media duration and range controls
        run: npm run test:media

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.manifest.outputs.version }}"
          tag="${GITHUB_REF_NAME}"
          notes_file="docs/releases/${version}.md"
          if [ ! -s "${notes_file}" ]; then
            echo "Release notes are missing or empty: ${notes_file}" >&2
            exit 1
          fi
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --title "${tag}" --notes-file "${notes_file}" --verify-tag
          else
            gh release edit "${tag}" --title "${tag}" --notes-file "${notes_file}"
          fi
          gh release upload "${tag}" \
            "build/${version}/release/"* \
            --clobber

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: build/${{ steps.manifest.outputs.version }}/release/*
